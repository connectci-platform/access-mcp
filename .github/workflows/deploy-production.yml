name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

# Serialize deploys to the single production host. Two CI pushes landing close
# together previously triggered two concurrent deploys that raced on
# `docker compose up --force-recreate`, churning containers and failing the
# smoke test. cancel-in-progress is false so a queued deploy WAITS for the
# in-flight one to finish rather than cancelling it mid-recreate.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          # Node.js MCP servers
          - package: affinity-groups
            dockerfile: Dockerfile.node
          - package: compute-resources
            dockerfile: Dockerfile.node
          - package: system-status
            dockerfile: Dockerfile.node
          - package: software-discovery
            dockerfile: Dockerfile.node
          - package: xdmod
            dockerfile: Dockerfile.node
          - package: allocations
            dockerfile: Dockerfile.node
          - package: nsf-awards
            dockerfile: Dockerfile.node
          - package: announcements
            dockerfile: Dockerfile.node
          - package: documentation
            dockerfile: Dockerfile.node
          - package: auth
            dockerfile: Dockerfile.node
          - package: events
            dockerfile: Dockerfile.node
          - package: jsm
            dockerfile: Dockerfile.node
          # Python MCP server
          - package: xdmod-mcp-data
            dockerfile: Dockerfile.python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.package }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PACKAGE=${{ matrix.package }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd ~/access-mcp

            # Pull latest code (reset to handle any local changes, .env is gitignored)
            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # Ensure the host-specific Caddyfile.local exists as a FILE before
            # compose up. It is gitignored (survives the reset), but on a host
            # that has none, a missing bind-mount source is auto-created by
            # Docker as a directory, which breaks Caddy's file mount.
            touch Caddyfile.local

            # Login to GitHub Container Registry
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Wait for registry propagation
            echo "Waiting for registry propagation..."
            sleep 10

            # Pull latest images with retry
            echo "Pulling latest images..."
            for i in 1 2 3; do
              docker compose -f docker-compose.prod.yml pull && break
              echo "Pull attempt $i failed, retrying in 10s..."
              sleep 10
            done

            # `up -d` alone won't recreate a container when only the image
            # digest moved under an unchanged `:latest` tag, so force-recreate
            # the app tier to pick up the pulled images. The stateful containers
            # (mcp-usage-db + the two backup sidecars) are excluded — no moving
            # app image, and they shouldn't churn on an app deploy.
            echo "Restarting services (force-recreate app tier)..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml up -d --force-recreate \
              caddy dashboard \
              mcp-auth mcp-affinity-groups mcp-compute-resources mcp-system-status \
              mcp-software-discovery mcp-xdmod mcp-allocations mcp-nsf-awards \
              mcp-announcements mcp-documentation mcp-events mcp-jsm mcp-xdmod-data

            # Clean up old images
            echo "Cleaning up old images..."
            docker image prune -f

            # Show running containers and their image versions
            echo "Running containers:"
            docker compose -f docker-compose.prod.yml ps
            echo ""
            echo "Image versions:"
            docker compose -f docker-compose.prod.yml images

      - name: Smoke test MCP servers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            FAILED=0

            # Check each MCP server's health AND that it's on the pulled image
            # (`/health` alone passes on a stale container). Compose resolves the
            # expected image id; compare it to what the container is running.
            #
            # Health is POLLED, not checked once after a fixed sleep: the deploy
            # force-recreates all app containers at once, so they cold-start
            # together and a fixed `sleep` races their boot. Retry each server's
            # /health for up to ~90s before declaring it down.
            COMPOSE="docker compose -f docker-compose.prod.yml"
            wait_for_health() {
              # $1 = port; returns 0 once /health responds, 1 after the timeout
              local port="$1" i
              for i in $(seq 1 45); do
                if curl -sf "http://localhost:${port}/health" > /dev/null 2>&1; then
                  return 0
                fi
                sleep 2
              done
              return 1
            }
            for server in auth compute-resources system-status software-discovery xdmod allocations nsf-awards xdmod-data announcements documentation events affinity-groups jsm; do
              CONTAINER="access-mcp-mcp-${server}-1"
              PORT=$(docker port "$CONTAINER" 3000/tcp 2>/dev/null | head -1 | cut -d: -f2)
              if [ -z "$PORT" ]; then
                echo "FAIL: mcp-${server} — container not running"
                FAILED=1
                continue
              fi
              if ! wait_for_health "$PORT"; then
                echo "FAIL: mcp-${server} — health check failed (not ready after ~90s)"
                FAILED=1
                continue
              fi
              # `docker inspect .Image` returns `sha256:<hex>` but
              # `compose images -q` returns the bare `<hex>` — strip the prefix
              # so the comparison is between like formats (else it mismatches on
              # every deploy, failing correct deploys, not just stale ones).
              RUNNING_IMG=$(docker inspect --format '{{.Image}}' "$CONTAINER" 2>/dev/null)
              RUNNING_IMG=${RUNNING_IMG#sha256:}
              EXPECTED_IMG=$($COMPOSE images -q "mcp-${server}" 2>/dev/null | head -1)
              EXPECTED_IMG=${EXPECTED_IMG#sha256:}
              if [ -n "$EXPECTED_IMG" ] && [ "$RUNNING_IMG" != "$EXPECTED_IMG" ]; then
                echo "FAIL: mcp-${server} — running a stale image (container did not recreate onto the pulled :latest)"
                FAILED=1
                continue
              fi
              echo "OK: mcp-${server}"
            done

            if [ "$FAILED" -ne 0 ]; then
              echo ""
              echo "One or more MCP servers failed health checks"
              exit 1
            fi
            echo ""
            echo "All MCP servers healthy"
